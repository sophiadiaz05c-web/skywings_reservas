<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SkyWings – Confirmación de Reserva</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="navbar no-print">
  <a href="index.html" class="navbar-brand">
    <span class="navbar-logo">✈</span>
    <div>
      <div class="navbar-name">SkyWings</div>
      <div class="navbar-tagline">Tu destino, nuestro compromiso</div>
    </div>
  </a>
  <ul class="navbar-nav">
    <li><a href="index.html">Inicio</a></li>
    <li><a href="admin.html">Admin</a></li>
  </ul>
</nav>

<div class="container">
  <div id="receiptWrapper"></div>
</div>

<script src="js/data.js"></script>
<script src="js/seatmap.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  const id          = new URLSearchParams(window.location.search).get('id');
  const wrapper     = document.getElementById('receiptWrapper');
  const reservation = SW.getReservations().find(r => r.id === id);

  if (!reservation) {
    wrapper.innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">❌</div>
        <p>Reserva no encontrada.</p>
        <a href="index.html" class="btn btn-primary mt-2">Volver al inicio</a>
      </div>`;
    return;
  }

  const flight   = SW.getFlightById(reservation.flightId);
  const exitRows = flight.emergencyExitRows || [9, 10];
  const shortId  = reservation.id.toUpperCase().slice(0, 6);

  const passengerRows = reservation.passengers.map((p, i) => {
    const rowNum = parseInt(p.seat);
    const isExit = exitRows.includes(rowNum);
    const conditions = [
      p.isMinor          ? 'Menor de edad' : '',
      p.age >= 60        ? 'Adulto mayor' : '',
      p.hasDisability    ? 'Discapacidad' : '',
      p.isRepresentative ? 'Representante' : ''
    ].filter(Boolean).join(', ') || 'Pasajero estándar';

    return `<tr>
      <td>${i + 1}</td>
      <td><strong>${p.name}</strong></td>
      <td>${p.idNumber}</td>
      <td>${p.age} años</td>
      <td>${conditions}</td>
      <td>
        <strong style="font-size:1.1rem;">${p.seat}</strong>
        ${isExit ? '<br><small style="color:#92400E;">⚠ Salida emergencia</small>' : ''}
      </td>
    </tr>`;
  }).join('');

  const exitNote = reservation.passengers.some(p => exitRows.includes(parseInt(p.seat)))
    ? `<div style="margin-top:1rem;padding:10px 14px;background:#FFFBEB;border:1px solid #FDE68A;border-radius:8px;font-size:0.82rem;color:#92400E;">
        <strong>⚠ Asiento de Salida de Emergencia:</strong> Los pasajeros asignados a filas de salida de emergencia
        deben estar en condiciones físicas de asistir en una evacuación y seguir las instrucciones de la tripulación.
       </div>`
    : '';

  wrapper.innerHTML = `
    <div class="receipt">

      <div class="receipt-header">
        <div class="receipt-logo">✈ SkyWings</div>
        <div class="receipt-sub">CONFIRMACIÓN DE RESERVA</div>
        <div class="receipt-id">SW-${shortId}</div>
      </div>

      <div class="receipt-section">
        <h4>Información del Vuelo</h4>
        <div class="route-display">
          <div>
            <div class="city-big">${flight.originCode}</div>
            <div style="font-size:0.82rem;color:var(--gray-500);margin-top:2px;">${flight.origin}</div>
          </div>
          <div class="route-sep">✈</div>
          <div>
            <div class="city-big">${flight.destCode}</div>
            <div style="font-size:0.82rem;color:var(--gray-500);margin-top:2px;">${flight.destination}</div>
          </div>
        </div>
        <div style="display:flex;gap:2rem;font-size:0.88rem;color:var(--gray-600);margin-top:0.5rem;flex-wrap:wrap;">
          <span>📅 <strong>${formatDate(flight.date)}</strong></span>
          <span>🕐 <strong>${flight.time}</strong></span>
          <span>✈ ${flight.aircraft}</span>
          <span class="status-badge status-${flight.status}">● ${{programado:'Programado',abordando:'Abordando',salido:'Salido'}[flight.status]}</span>
        </div>
      </div>

      <div class="receipt-section">
        <h4>Pasajeros y Asientos</h4>
        <div class="table-wrapper">
          <table>
            <thead>
              <tr>
                <th>#</th>
                <th>Nombre</th>
                <th>Cédula / Pasaporte</th>
                <th>Edad</th>
                <th>Condición</th>
                <th>Asiento</th>
              </tr>
            </thead>
            <tbody>${passengerRows}</tbody>
          </table>
        </div>
        ${exitNote}
      </div>

      <div class="receipt-section" style="font-size:0.8rem;color:var(--gray-400);text-align:center;">
        Reserva generada el ${new Date(reservation.createdAt).toLocaleString('es-VE')} &nbsp;·&nbsp; SkyWings Airlines
      </div>

    </div>

    <div class="receipt-actions no-print">
      <a href="index.html" class="btn btn-outline">← Inicio</a>
      <button class="btn btn-primary" onclick="window.print()">🖨 Imprimir Confirmación</button>
    </div>`;
});
</script>
</body>
</html>

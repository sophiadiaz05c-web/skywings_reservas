<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SkyWings – Iniciar Sesión</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">

<div class="auth-wrapper">
  <div class="auth-card">

    <div class="auth-logo">
      <div class="auth-logo-icon">✈</div>
      <div class="auth-logo-name">SkyWings</div>
      <div class="auth-logo-sub">Tu destino, nuestro compromiso</div>
    </div>

    <h2 class="auth-title">Iniciar Sesión</h2>

    <div id="loginMsg"></div>

    <form onsubmit="doLogin(event)">
      <div class="form-group">
        <label class="form-label">Correo electrónico</label>
        <input type="email" id="loginEmail" class="form-control"
               placeholder="usuario@correo.com" required autofocus>
      </div>

      <div class="form-group">
        <label class="form-label">Contraseña</label>
        <input type="password" id="loginPass" class="form-control"
               placeholder="••••••••" required>
      </div>

      <button type="submit" class="btn btn-primary btn-full btn-lg" style="margin-top:0.5rem;">
        Entrar
      </button>
    </form>

    <div class="auth-footer">
      ¿No tienes cuenta?
      <a href="registro.html">Regístrate aquí</a>
    </div>

    <div class="auth-hint">
      <strong>Admin:</strong> admin@skywings.com / admin123
    </div>

  </div>
</div>

<script src="js/data.js"></script>
<script src="js/auth.js"></script>
<script>
  // Redirect if already logged in
  (function () {
    const s = Auth.getSession();
    if (s) window.location.href = s.role === 'admin' ? 'admin.html' : 'index.html';
  })();

  function doLogin(e) {
    e.preventDefault();
    const email = document.getElementById('loginEmail').value;
    const pass  = document.getElementById('loginPass').value;
    const result = Auth.login(email, pass);

    if (result.ok) {
      const s = Auth.getSession();
      window.location.href = s.role === 'admin' ? 'admin.html' : 'index.html';
    } else {
      document.getElementById('loginMsg').innerHTML =
        `<div class="alert alert-danger">${result.msg}</div>`;
    }
  }
</script>
</body>
</html>
